name: VOCANTA Inbox

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocanta-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VOCANTA_GMAIL_TOKEN_JSON: ${{ secrets.VOCANTA_GMAIL_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Process employer responses
        run: python inbox_runtime.py
      - name: Publish pipeline analytics
        if: always()
        run: python analytics.py
      - name: Upload pipeline analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocanta-inbox-analytics-${{ github.run_id }}
          path: exports/analytics.html
          if-no-files-found: warn
          retention-days: 14
